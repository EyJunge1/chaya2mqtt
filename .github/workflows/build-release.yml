name: Build and release firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set APP_VERSION from tag
        run: |
          cat > src/version.h <<EOF
          #pragma once
          #define APP_VERSION "${{ github.ref_name }}"
          EOF

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build release firmware
        run: pio run -e esp32dev-release

      - name: Compute firmware hashes
        run: |
          cd .pio/build/esp32dev-release
          sha256sum firmware.bin | awk '{print $1}' > firmware.sha256
          sha512sum firmware.bin | awk '{print $1}' > firmware.sha512

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            .pio/build/esp32dev-release/firmware.bin
            .pio/build/esp32dev-release/firmware.sha256
            .pio/build/esp32dev-release/firmware.sha512
