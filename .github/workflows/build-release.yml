name: Build and release firmware

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate CalVer release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag="${GITHUB_REF_NAME}"
          # Stable: vYYYY.M.PATCH  |  RC: vYYYY.M.PATCH-rc.N  (month without leading zero)
          if [[ "$tag" =~ ^v[0-9]{4}\.([1-9]|1[0-2])\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            exit 0
          fi
          echo "Unsupported release tag: $tag"
          echo "Expected: vYYYY.M.PATCH or vYYYY.M.PATCH-rc.N (e.g. v2026.8.1 or v2026.8.1-rc.1)"
          exit 1

      - name: Set APP_VERSION from tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cat > src/config/version.h <<EOF
          #pragma once
          #define APP_VERSION "${version}"
          EOF
          echo "APP_VERSION=${version}"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build frontend and embed SPA
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          python3 scripts/embed_web_assets.py

      - name: Build release firmware
        run: pio run -e esp32dev-release

      - name: Check firmware fits OTA slot
        run: |
          SIZE=$(stat -c%s .pio/build/esp32dev-release/firmware.bin)
          MAX=$((0x1E0000))
          echo "firmware.bin=$SIZE bytes (limit $MAX)"
          test "$SIZE" -le "$MAX"

      - name: Compute firmware MD5
        id: hashes
        run: |
          cd .pio/build/esp32dev-release
          md5sum firmware.bin | awk '{print $1}' > firmware.md5
          echo "md5=$(cat firmware.md5)" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ !contains(github.ref_name, '-rc.') }}
          body: |
            ## Firmware ${{ github.ref_name }}

            | Algorithm | Hash |
            |-------------|------|
            | MD5         | `${{ steps.hashes.outputs.md5 }}` |
          files: |
            .pio/build/esp32dev-release/firmware.bin
            .pio/build/esp32dev-release/firmware.md5
