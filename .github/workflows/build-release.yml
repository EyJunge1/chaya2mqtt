name: Build and release firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set APP_VERSION from tag
        run: |
          cat > src/config/version.h <<EOF
          #pragma once
          #define APP_VERSION "${{ github.ref_name }}"
          EOF

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install PlatformIO
        run: pip install platformio

      - name: Frontend tests
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

      - name: Embed SPA assets
        run: python3 tools/embed_web_assets.py

      - name: Build release firmware
        run: pio run -e esp32dev-release

      - name: Check firmware fits OTA slot
        run: |
          SIZE=$(stat -c%s .pio/build/esp32dev-release/firmware.bin)
          MAX=$((0x1E0000))
          echo "firmware.bin=$SIZE bytes (limit $MAX)"
          test "$SIZE" -le "$MAX"

      - name: Compute firmware hashes
        id: hashes
        run: |
          cd .pio/build/esp32dev-release
          sha256sum firmware.bin | awk '{print $1}' > firmware.sha256
          echo "sha256=$(cat firmware.sha256)" >> $GITHUB_OUTPUT

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          body: |
            ## Firmware ${{ github.ref_name }}

            | Algorithmus | Hash |
            |-------------|------|
            | SHA-256     | `${{ steps.hashes.outputs.sha256 }}` |
          files: |
            .pio/build/esp32dev-release/firmware.bin
            .pio/build/esp32dev-release/firmware.sha256
