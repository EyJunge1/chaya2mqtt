name: Bug report
description: Report a reproducible bug in firmware, the web interface, or hardware documentation
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, private MQTT topics, or other credentials. Review logs and screenshots before submitting and redact them if necessary.
  - type: input
    id: version
    attributes:
      label: Version
      description: Firmware version, release tag, or commit
      placeholder: v2026.8.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Firmware
        - Web interface
        - MQTT
        - Wi-Fi / Setup
        - OTA
        - Display
        - Hardware
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened?
      placeholder: A short, clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide detailed steps to reproduce the bug
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / Hardware
      description: Optional, but helpful. Examples depend on the affected area.
      placeholder: |
        Hardware: Waveshare ESP32-S3-ePaper-1.54G (SKU 34586)
        Build: esp32s3 or esp32s3-release
        MQTT broker: type and TLS yes/no (without credentials)
        Browser/OS: only for the web interface
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Do not include passwords, tokens, private MQTT topics, or other credentials. Redact logs if necessary.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Screenshots / Additional information
      description: Optional screenshots, serial number details without secrets, or other contextual information.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have checked existing issues for duplicates.
          required: true
        - label: This report does not contain credentials or other sensitive data.
          required: true
