version: 2

# PlatformIO (platformio.ini / lib_deps) is not yet supported by Dependabot.
# See: https://github.com/dependabot/dependabot-core/issues/13206
# PlatformIO library updates: renovate.json. Pinned platform/framework commits are reviewed
# manually because the OTA SHA-256 API depends on specific upstream changes.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      frontend-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /flasher
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      flasher-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      flasher-major:
        patterns:
          - "*"
        update-types:
          - major
