asyncapi: 3.1.0
info:
  title: Chaya2MQTT Server-Sent Events
  version: 1.0.0
  description: Live status events for the device web admin.
  contact:
    name: Chaya2MQTT
    url: https://eyjunge1.github.io/chaya2mqtt/
  license:
    name: GNU GPL v3.0 only
    url: https://github.com/EyJunge1/chaya2mqtt/blob/main/LICENSE
servers:
  device:
    host: chaya2mqtt-{deviceId}.local
    pathname: /events
    protocol: http
    description: STA mDNS hostname
    variables:
      deviceId:
        default: deviceId
  setup:
    host: 4.3.2.1
    pathname: /events
    protocol: http
    description: AP setup mode
channels:
  events:
    address: /events
    messages:
      chaya:
        $ref: "#/components/messages/ChayaEvent"
      wifi:
        $ref: "#/components/messages/WifiEvent"
      mqtt:
        $ref: "#/components/messages/MqttEvent"
      ota:
        $ref: "#/components/messages/OtaEvent"
      device:
        $ref: "#/components/messages/DeviceEvent"
operations:
  receiveChaya:
    action: receive
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/chaya"
  receiveWifi:
    action: receive
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/wifi"
  receiveMqtt:
    action: receive
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/mqtt"
  receiveOta:
    action: receive
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/ota"
  receiveDevice:
    action: receive
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/device"
components:
  messages:
    ChayaEvent:
      name: chaya
      title: Heart counters
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChayaStatus"
    WifiEvent:
      name: wifi
      title: Wi-Fi status
      contentType: application/json
      payload:
        $ref: "#/components/schemas/WifiStatus"
    MqttEvent:
      name: mqtt
      title: MQTT status
      contentType: application/json
      payload:
        type: object
        required: [connected]
        properties:
          connected: { type: boolean }
    OtaEvent:
      name: ota
      title: OTA status
      contentType: application/json
      payload:
        $ref: "#/components/schemas/OtaStatus"
    DeviceEvent:
      name: device
      title: Battery status
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DeviceBattery"
  schemas:
    DeviceBattery:
      type: object
      required: [batteryMv, batteryPct]
      properties:
        batteryMv: { type: integer }
        batteryPct: { type: integer, minimum: 0, maximum: 100 }
    ChayaStatus:
      type: object
      required: [rx, tx, connected, configured, paired]
      properties:
        rx:
          type: integer
          description: Received hearts since last reset
        tx:
          type: integer
          description: Sent hearts since last reset
        connected:
          type: boolean
          description: MQTT client connected
        configured:
          type: boolean
          description: MQTT broker configured
        paired:
          type: boolean
          description: Partner ID set
    WifiStatus:
      oneOf:
        - type: object
          required: [connected]
          properties:
            connected: { type: boolean, const: false }
        - type: object
          required: [connected, ssid, ip, gateway, netmask, dns1, dns2, rssi]
          properties:
            connected: { type: boolean, const: true }
            ssid: { type: string }
            ip: { type: string }
            gateway: { type: string }
            netmask: { type: string }
            dns1: { type: string }
            dns2: { type: string }
            rssi: { type: integer }
    OtaStatus:
      type: object
      required:
        [phase, channel, localVersion, availableVersion, bytesDone, bytesTotal, error, generation]
      properties:
        phase:
          type: string
          enum: [idle, checking, available, downloading, verifying, rebooting, error]
        channel:
          type: string
          enum: [stable, beta]
        localVersion: { type: string }
        availableVersion: { type: string }
        bytesDone: { type: integer }
        bytesTotal: { type: integer }
        error: { type: string }
        generation: { type: integer }
