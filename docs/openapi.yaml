openapi: 3.2.0
info:
  title: Chaya2MQTT Web Admin API
  version: 1.0.0
  description: |
    HTTP JSON API served by the device firmware (ESPAsyncWebServer on port 80).
    Mutations use `application/x-www-form-urlencoded` and require `csrf_token`.
    There is no login; access is limited by Host/Origin allowlists on the LAN.
    Routes restricted to STA or setup-AP mode return HTTP 400 with `ap_mode` or
    `not_ap`. Temporarily blocked operations return HTTP 503 with `busy` or `shutdown`.
  license:
    name: GNU General Public License v3.0 only
    identifier: GPL-3.0-only
servers:
  - url: http://chaya2mqtt-{deviceId}.local
    description: STA mode via the device-specific mDNS hostname
    variables:
      deviceId:
        default: a1b2c3
        description: Six-character device ID from NVS (random; MAC-seeded once on OTA migration)
  - url: http://4.3.2.1
    description: AP setup mode
security: []
tags:
  - name: csrf
    description: CSRF token for state-changing requests
  - name: device
    description: Device identity and firmware mode
  - name: chaya
    description: Heart counters and send action
  - name: wifi
    description: Wi-Fi status, scan, and setup
  - name: mqtt
    description: MQTT broker, pairing and derived topics
  - name: settings
    description: General device settings and reboot
  - name: update
    description: Firmware OTA status and install
  - name: reset
    description: Factory reset
paths:
  /api/csrf:
    get:
      tags: [csrf]
      summary: Fetch CSRF token
      operationId: getCsrf
      responses:
        "200":
          description: Token payload
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresInSeconds]
                properties:
                  token:
                    type: string
                    pattern: "^[0-9a-f]{32}$"
                  expiresInSeconds:
                    type: integer
                    minimum: 0
                    maximum: 86400
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/bootstrap:
    get:
      tags: [device]
      summary: Cold-boot snapshot (csrf + device + status)
      operationId: getBootstrap
      responses:
        "200":
          description: Aggregated boot payload
          content:
            application/json:
              schema:
                type: object
                required: [csrf, device, wifi]
                properties:
                  csrf:
                    type: object
                    required: [token, expiresInSeconds]
                    properties:
                      token: { type: string }
                      expiresInSeconds: { type: integer, minimum: 0 }
                  device:
                    type: object
                  wifi:
                    type: object
                  chaya:
                    nullable: true
                    type: object
                  mqtt:
                    nullable: true
                    type: object
                  update:
                    nullable: true
                    type: object
                  settings:
                    nullable: true
                    type: object
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/device:
    get:
      tags: [device]
      summary: Device identity and mode
      operationId: getDevice
      responses:
        "200":
          description: Device info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceInfo"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/chaya:
    get:
      tags: [chaya]
      summary: Heart counters (STA)
      operationId: getChaya
      responses:
        "200":
          description: Counter snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChayaStatus"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/chaya/send:
    post:
      tags: [chaya]
      summary: Queue heart send (requires broker and partner)
      operationId: sendChaya
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CsrfForm"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ApiError"
  /api/wifi/status:
    get:
      tags: [wifi]
      summary: Current Wi-Fi link status
      operationId: getWifiStatus
      responses:
        "200":
          description: Connected or disconnected status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WifiStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/wifi/config:
    get:
      tags: [wifi]
      summary: Stored Wi-Fi config (no password)
      operationId: getWifiConfig
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WifiConfig"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/wifi/scan:
    get:
      tags: [wifi]
      summary: Read cached access-point scan
      operationId: getWifiScan
      description: >
        Read-only snapshot. Does not start a sweep; POST /api/wifi/scan kicks.
        `status` is idle (never started), pending (kick or sweep in flight),
        ready (aps present), or failed (last sweep failed).
      responses:
        "200":
          description: Scan snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WifiScanSnapshot"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [wifi]
      summary: Start access-point scan
      operationId: startWifiScan
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CsrfForm"
      responses:
        "202":
          description: Scan kicked; poll GET for results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/wifi/connect:
    post:
      tags: [wifi]
      summary: Start AP test or save STA credentials
      operationId: connectWifi
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/CsrfForm"
                - type: object
                  required: [ssid, mode]
                  properties:
                    ssid: { type: string, minLength: 1, maxLength: 32 }
                    password: { type: string, maxLength: 63 }
                    mode: { type: string, enum: [dhcp, static] }
                    ip: { type: string, maxLength: 15 }
                    gateway: { type: string, maxLength: 15 }
                    netmask: { type: string, maxLength: 15 }
                    dns1: { type: string, maxLength: 15 }
                    dns2: { type: string, maxLength: 15 }
                    ntp1: { type: string, maxLength: 63 }
                    ntp2: { type: string, maxLength: 63 }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Failed to persist Wi‑Fi credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErr"
              example:
                ok: false
                error: save
        "503":
          description: Connection test could not start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErr"
              example:
                ok: false
                error: test_start
  /api/wifi/connect-status:
    get:
      tags: [wifi]
      summary: AP connection test status
      operationId: getWifiConnectStatus
      responses:
        "200":
          description: Test state
          content:
            application/json:
              schema:
                type: object
                required: [state, ssid]
                properties:
                  state:
                    type: string
                    enum: [idle, testing, ok, fail]
                  ssid:
                    type: string
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/wifi/connect-commit:
    post:
      tags: [wifi]
      summary: Commit successful AP test and reboot
      operationId: commitWifiConnect
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CsrfForm"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/wifi/connect-abort:
    post:
      tags: [wifi]
      summary: Abort AP connection test
      operationId: abortWifiConnect
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CsrfForm"
      responses:
        "200":
          description: Aborted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/wifi/connect-retry:
    post:
      tags: [wifi]
      summary: Retry failed AP connection test with the same credentials
      operationId: retryWifiConnect
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CsrfForm"
      responses:
        "200":
          description: Retry started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ApiError"
  /api/mqtt/status:
    get:
      tags: [mqtt]
      summary: MQTT connection status (STA)
      operationId: getMqttStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [connected]
                properties:
                  connected: { type: boolean }
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/mqtt:
    get:
      tags: [mqtt]
      summary: MQTT config view (password never returned)
      operationId: getMqttConfig
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttConfigView"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ApiError"
    post:
      tags: [mqtt]
      summary: Save MQTT broker and partner ID (topics are derived)
      operationId: saveMqttConfig
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/CsrfForm"
                - type: object
                  properties:
                    mqtt_server:
                      type: string
                      maxLength: 127
                      description: Broker hostname or IP; omitted fields keep their current value
                    mqtt_port:
                      type: integer
                      description: MQTT port (typically 1883 plain / 8883 TLS); omitted fields keep their current value
                    mqtt_tls:
                      type: integer
                      enum: [0, 1]
                      description: >
                        1 = mqtts (TLS), 0 = mqtt (plain TCP). Omitted fields keep their current value.
                        Default for new/missing NVS is TLS (1).
                    mqtt_user:
                      type: string
                      maxLength: 63
                      description: MQTT username (optional; empty for anonymous)
                    mqtt_pass:
                      type: string
                      maxLength: 63
                      description: >
                        MQTT password (optional). Omit or leave empty to keep the stored password.
                    partner_id:
                      type: string
                      maxLength: 6
                      description: >
                        Optional pairing: 6 lowercase hex digits for the partner device,
                        or empty to unpair.
                        Topics are derived automatically.
                      pattern: "^([0-9a-f]{6})?$"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ApiError"
  /api/settings:
    get:
      tags: [settings]
      summary: Device settings
      operationId: getSettings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsInfo"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [settings]
      summary: Save settings
      operationId: saveSettings
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/CsrfForm"
                - type: object
                  properties:
                    reset_days: { type: integer, minimum: 0, maximum: 30 }
                    lang: { type: string, enum: [de, en] }
                    theme: { type: string, enum: [system, dark, light] }
                    led_enabled:
                      {
                        type: integer,
                        enum: [0, 1],
                        description: Header user LED activity (0 = off),
                      }
                    audio_tx_enabled:
                      {
                        type: integer,
                        enum: [0, 1],
                        description: Enable click when a heart is sent (default off),
                      }
                    audio_rx_enabled:
                      {
                        type: integer,
                        enum: [0, 1],
                        description: Enable click when a heart is received (default off),
                      }
                    audio_tx_volume: { type: integer, minimum: 0, maximum: 100, description: TX click volume }
                    audio_rx_volume: { type: integer, minimum: 0, maximum: 100, description: RX click volume }
                    quiet_hour_start: { type: integer, minimum: 0, maximum: 23 }
                    quiet_hour_end: { type: integer, minimum: 0, maximum: 23 }
                    tx_hz: { type: integer, minimum: 40, maximum: 2000, description: Send click frequency Hz }
                    tx_ms: { type: integer, minimum: 20, maximum: 500, description: Send click duration ms }
                    rx_hz: { type: integer, minimum: 40, maximum: 2000, description: Receive click frequency Hz }
                    rx_ms: { type: integer, minimum: 20, maximum: 500, description: Receive click duration ms }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ApiError"
  /api/reboot:
    post:
      tags: [settings]
      summary: Reboot device
      operationId: rebootDevice
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CsrfForm"
      responses:
        "200":
          description: Reboot scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ApiError"
  /api/factory-reset:
    post:
      tags: [reset]
      summary: Factory reset
      operationId: factoryReset
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CsrfForm"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ApiError"
  /api/update/status:
    get:
      tags: [update]
      summary: OTA status
      operationId: getUpdateStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtaStatus"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/update/check:
    post:
      tags: [update]
      summary: Check GitHub for updates
      operationId: checkUpdate
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/CsrfForm"
                - type: object
                  properties:
                    channel:
                      type: string
                      enum: [stable, beta]
      responses:
        "200":
          description: Check queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ApiError"
  /api/update/install:
    post:
      tags: [update]
      summary: Install pending update
      operationId: installUpdate
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CsrfForm"
      responses:
        "200":
          description: Install started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
components:
  schemas:
    CsrfForm:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
    ApiOk:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
        message:
          type: string
        queued:
          type: boolean
        next:
          type: string
          description: UI path or absolute device URL to open after the operation
    ApiErr:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
    DeviceInfo:
      type: object
      required: [hostname, version, mode, deviceId, batteryMv, batteryPct]
      properties:
        hostname:
          type: string
          description: "`chaya2mqtt` in AP mode; `chaya2mqtt-<deviceId>` in STA mode"
        version: { type: string }
        mode: { type: string, enum: [ap, sta] }
        deviceId: { type: string }
        batteryMv:
          type: integer
          description: LiPo pack millivolts (GPIO4 ADC × 2)
        batteryPct:
          type: integer
          minimum: 0
          maximum: 100
          description: Coarse LiPo estimate
        apSsid:
          type: string
          description: SoftAP SSID (AP/setup mode only)
        apIp:
          type: string
          description: SoftAP IPv4 (AP/setup mode only)
    ChayaStatus:
      type: object
      required: [rx, tx, connected, configured, paired]
      properties:
        rx:
          type: integer
          description: Uncapped received-heart display delta (absolute counter minus saved baseline)
        tx:
          type: integer
          description: Uncapped sent-heart display delta (absolute counter minus saved baseline)
        connected:
          type: boolean
          description: Whether the MQTT client is currently connected
        configured:
          type: boolean
          description: Whether an MQTT broker is configured
        paired:
          type: boolean
          description: Whether a partner device ID is set (required for heart send / heart display)
    WifiStatus:
      oneOf:
        - type: object
          required: [connected]
          properties:
            connected: { type: boolean, const: false }
        - type: object
          required: [connected, ssid, ip, gateway, netmask, dns1, dns2, rssi]
          properties:
            connected: { type: boolean, const: true }
            ssid: { type: string }
            ip: { type: string }
            gateway: { type: string }
            netmask: { type: string }
            dns1: { type: string }
            dns2: { type: string }
            rssi: { type: integer }
    WifiConfig:
      type: object
      required: [ssid, mode, ip, gateway, netmask, dns1, dns2, ntp1, ntp2]
      properties:
        ssid: { type: string }
        mode: { type: string, enum: [dhcp, static] }
        ip: { type: string }
        gateway: { type: string }
        netmask: { type: string }
        dns1: { type: string }
        dns2: { type: string }
        ntp1: { type: string }
        ntp2: { type: string }
    WifiScanAp:
      type: object
      required: [ssid, rssi, open]
      properties:
        ssid: { type: string }
        rssi: { type: integer }
        open: { type: boolean }
    WifiScanSnapshot:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [idle, pending, ready, failed]
        aps:
          type: array
          items:
            $ref: "#/components/schemas/WifiScanAp"
    MqttConfigView:
      type: object
      required: [deviceId, server, port, tls, username, hasPassword, topicPub, topicSub, partnerId]
      properties:
        deviceId:
          type: string
          description: Own 6-char lowercase hex device ID (NVS `cfg/device_id`)
        server: { type: string }
        port: { type: integer }
        tls:
          type: boolean
          description: true = mqtts (TLS on typically 8883), false = mqtt (plain TCP on typically 1883)
        username: { type: string }
        hasPassword: { type: boolean }
        topicPub:
          type: string
          description: Derived publish topic chaya2mqtt/<deviceId>
        topicSub:
          type: string
          description: Derived subscribe topic chaya2mqtt/<partnerId>, or empty when unpaired
        partnerId: { type: string }
        nvsOk:
          {
            type: boolean,
            description: false when last deferred MQTT NVS persist failed (QUAL-01),
          }
        applyPending:
          {
            type: boolean,
            description: true while a changing MQTT POST is queued or the network task is still applying (QUAL-04),
          }
    SettingsInfo:
      type: object
      required:
        [
          resetDays,
          lang,
          theme,
          ledEnabled,
          audioTxEnabled,
          audioRxEnabled,
          audioTxVolume,
          audioRxVolume,
          quietHourStart,
          quietHourEnd,
          txHz,
          txMs,
          rxHz,
          rxMs,
        ]
      properties:
        resetDays: { type: integer, minimum: 0, maximum: 30 }
        lang: { type: string, enum: [de, en] }
        theme: { type: string, enum: [system, dark, light] }
        ledEnabled:
          type: boolean
          description: Header user LED activity (false = dark except factory reset)
        audioTxEnabled:
          type: boolean
          description: Click when a heart is sent (default false)
        audioRxEnabled:
          type: boolean
          description: Click when a heart is received (default false)
        audioTxVolume:
          type: integer
          minimum: 0
          maximum: 100
          description: TX click volume (default 70)
        audioRxVolume:
          type: integer
          minimum: 0
          maximum: 100
          description: RX click volume (default 70)
        quietHourStart:
          type: integer
          minimum: 0
          maximum: 23
          description: Quiet hours start (local, after NTP). Equal to quietHourEnd = off (default both 0)
        quietHourEnd:
          type: integer
          minimum: 0
          maximum: 23
        txHz:
          type: integer
          minimum: 40
          maximum: 2000
          description: Send click sine frequency (Hz)
        txMs:
          type: integer
          minimum: 20
          maximum: 500
          description: Send click duration (ms)
        rxHz:
          type: integer
          minimum: 40
          maximum: 2000
          description: Receive click sine frequency (Hz)
        rxMs:
          type: integer
          minimum: 20
          maximum: 500
          description: Receive click duration (ms)
        nvsOk:
          type: boolean
          description: false when last deferred settings NVS persist failed (QUAL-01)
        applyPending:
          type: boolean
          description: true while settings apply is queued or retrying (QUAL-04)
    OtaStatus:
      type: object
      required:
        [phase, channel, localVersion, availableVersion, bytesDone, bytesTotal, error, generation]
      properties:
        phase:
          type: string
          enum: [idle, checking, available, downloading, verifying, rebooting, error]
        channel:
          type: string
          enum: [stable, beta]
        localVersion: { type: string }
        availableVersion: { type: string }
        bytesDone: { type: integer }
        bytesTotal: { type: integer }
        error: { type: string }
        generation: { type: integer }
  responses:
    Forbidden:
      description: Host/Origin or CSRF rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErr"
    ApiError:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErr"
