[package]
name = "chaya-fw"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Chaya2MQTT firmware — esp-hal rewrite"
repository.workspace = true
publish = false

[lib]
name = "chaya_fw"
path = "src/lib.rs"

[[bin]]
name = "chaya-fw"
path = "src/main.rs"
required-features = ["device"]

[build-dependencies]
flate2 = "1.0"

[dependencies]
chaya-pure = { path = "../chaya-pure" }
heapless = "0.8"
sha2 = { version = "0.10", default-features = false }
qrcodegen-no-heap = { version = "1.8", optional = true }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.6", default-features = false, features = ["heapless"] }

# --- device feature ---
esp-hal = { version = "1.2", optional = true, features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.20", optional = true, features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18", optional = true, features = ["esp32s3", "log-04"] }
esp-alloc = { version = "0.11", optional = true, features = ["esp32s3"] }
esp-rtos = { version = "0.4", optional = true, features = ["esp32s3", "embassy", "esp-radio", "esp-alloc", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", optional = true, features = ["esp32s3", "wifi", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6", optional = true, features = ["esp32s3"] }
esp-storage = { version = "0.10", optional = true, features = ["esp32s3", "embedded-storage"] }
embassy-executor = { version = "0.10", optional = true }
embassy-net = { version = "0.9", optional = true, features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns", "multicast", "proto-ipv4"] }
embassy-time = { version = "0.5", optional = true }
embassy-futures = { version = "0.1", optional = true }
embedded-io-async = { version = "0.7", optional = true }
edge-dhcp = { version = "0.8", optional = true }
edge-captive = { version = "0.8", optional = true, default-features = false, features = ["io"] }
edge-nal = { version = "0.7", optional = true }
edge-nal-embassy = { version = "0.9", optional = true }
embassy-sync = { version = "0.8", optional = true }
nb = { version = "1.1", optional = true }
static_cell = { version = "2.1", optional = true }
log = { version = "0.4", optional = true }
epdsi = { version = "0.7", optional = true, features = ["blocking", "graphics"] }
embedded-graphics = { version = "0.8", optional = true }
embedded-hal = { version = "1.0", optional = true }
embedded-hal-bus = { version = "0.3", optional = true }
embedded-storage = { version = "0.3", optional = true }
embedded-tls = { version = "0.19", optional = true, default-features = false }
rand_core = { version = "0.6", optional = true, default-features = false }
# edge-mdns 0.8 needs rand_core 0.10 (parallel to 0.6 for embedded-tls).
rand_core10 = { package = "rand_core", version = "0.10", optional = true, default-features = false }
esp-hal-ota = { version = "0.6", optional = true, features = ["esp32s3"] }
edge-http = { version = "0.8", optional = true, default-features = false, features = ["io", "log"] }
edge-mdns = { version = "0.8", optional = true, default-features = false, features = ["io", "log"] }
sntpc = { version = "0.11", optional = true, default-features = false }
es8311 = { version = "0.1", optional = true }
# Hardware TLS (CA verify). Needs cmake + `xtensa-esp-elf-gcc` on PATH (`use-gcc`).
# Enable with `--features device,mbedtls`. Default device keeps embedded-tls host-pin.
mbedtls-rs = { git = "https://github.com/esp-rs/esp-mbedtls.git", optional = true, default-features = false, features = ["esp32s3", "embassy-time", "hook-timer", "tls", "use-gcc"] }
critical-section = { version = "1", optional = true, default-features = false }
# mbedtls-rs C layer needs libc bits (calloc/free/mem*); same as esp-mbedtls examples.
tinyrlibc = { version = "0.5", optional = true, default-features = false, features = ["memchr"] }
# reqwless skipped: 0.13 pins embedded-tls 0.17 / io-async 0.6; 0.14 needs rustc ≥1.91.

[features]
default = []
device = [
  "dep:esp-hal",
  "dep:esp-backtrace",
  "dep:esp-println",
  "dep:esp-alloc",
  "dep:esp-rtos",
  "dep:esp-radio",
  "dep:esp-bootloader-esp-idf",
  "dep:esp-storage",
  "dep:embassy-executor",
  "dep:embassy-net",
  "dep:embassy-time",
  "dep:embassy-futures",
  "dep:embedded-io-async",
  "dep:edge-dhcp",
  "dep:edge-captive",
  "dep:edge-nal",
  "dep:edge-nal-embassy",
  "dep:edge-http",
  "dep:edge-mdns",
  "dep:embassy-sync",
  "dep:nb",
  "dep:static_cell",
  "dep:log",
  "dep:epdsi",
  "dep:embedded-graphics",
  "dep:embedded-hal",
  "dep:embedded-hal-bus",
  "dep:embedded-storage",
  "dep:embedded-tls",
  "dep:rand_core",
  "dep:rand_core10",
  "dep:esp-hal-ota",
  "dep:qrcodegen-no-heap",
  "dep:sntpc",
  "dep:es8311",
  "dep:critical-section",
]
# Optional hardware CA verify via mbedtls-rs (cmake + espup required).
# Use with `--features device,mbedtls` (mbedtls alone is not meaningful on host).
mbedtls = ["dep:mbedtls-rs", "dep:tinyrlibc"]
