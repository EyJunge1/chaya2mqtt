; Production firmware: pio run -e esp32s3-release (default environment, CORE_DEBUG_LEVEL=0)
; Target board: Waveshare ESP32-S3-ePaper-1.54G (SKU 34586).
[platformio]
default_envs = esp32s3-release

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
board_build.cppstd = gnu++17
; Match runtime setCpuFrequencyMhz(240) / esp_pm max_freq (avoid F_CPU vs. actual mismatch).
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_chaya_8mb.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters =
    esp32_exception_decoder
    time
; Host cppcheck cannot parse all FreeRTOS/Arduino macros; suppress known noise.
check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,performance,portability --inline-suppr --suppress=*:*/.pio/* --suppress=syntaxError --suppress=unusedFunction --suppress=cstyleCast --suppress=comparePointers --suppress=missingIncludeSystem
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -Wextra
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    ZinggJM/GxEPD2@1.6.9
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0
extra_scripts =
    pre:scripts/pio_pre_frontend.py

[env:esp32s3-release]
extends = env:esp32s3
; -flto was tested: linking fails (undefined app_main / LTO incompatible with prebuilt Arduino libraries).
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -Os
    -DNDEBUG
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; inherit extra_scripts from esp32s3

[env:native]
platform = native
test_framework = unity
build_flags =
    -Isrc
    -Isim
    -std=gnu++17
    -Wall
    -Wextra
build_src_filter =
    -<*>

; Same Unity suite with ASan + UBSan (host only).
[env:native-asan]
platform = native
test_framework = unity
build_flags =
    -Isrc
    -Isim
    -std=gnu++17
    -Wall
    -Wextra
    -g
    -O1
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
build_src_filter =
    -<*>
extra_scripts =
    pre:scripts/pio_native_asan.py

; Alias: run only device-sim Unity scenarios.
[env:device-sim]
extends = env:native
test_filter = test_device_sim
