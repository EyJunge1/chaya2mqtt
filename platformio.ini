[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.cppstd = gnu++17
; Match runtime setCpuFrequencyMhz(240) / esp_pm max_freq (avoid F_CPU vs. actual mismatch).
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -Wextra
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Isrc/display/epd
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit BusIO@^1.17.4
    ESP32Async/ESPAsyncWebServer@^3.11.0

[env:esp32dev-release]
extends = env:esp32dev
; -flto wurde getestet: Link schlaegt fehl (undefined app_main / LTO mit vorgebauten Arduino-Libs inkompatibel).
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -Os
    -DNDEBUG
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Isrc/display/epd
