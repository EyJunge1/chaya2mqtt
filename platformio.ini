; Production firmware: pio run -e esp32s3-release (default environment, CORE_DEBUG_LEVEL=0)
; Target board: Waveshare ESP32-S3-ePaper-1.54G (SKU 34586).
[platformio]
default_envs = esp32s3-release

[env:esp32s3]
; Pinned because pioarduino stable (Arduino 3.3.9 / 55.03.39) lacks HTTPUpdate
; SHA-512 sidecar APIs (#12865; SHA-256/SHA-512 live in their own TUs so unused
; hashes drop out), STA setInactiveTime (#12867), and HTTP QUERY (#12895).
; framework-arduinoespressif32 is the #12865 merge commit.
; Renovate proposes grouped digest updates for these three pins (renovate.json).
platform = https://github.com/pioarduino/platform-espressif32.git#2959e98a2750832bca32fd2f849c0c274a4cdd63
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#6b41cf6f6f272538ee91746f26c5068e2ca692e4
    framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/esp32-arduino-libs-idf-release_v5.5-b774170f-v3.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
board_build.cppstd = gnu++23
; Match runtime setCpuFrequencyMhz(240) / esp_pm max_freq (avoid F_CPU vs. actual mismatch).
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_chaya_8mb.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters =
    esp32_exception_decoder
    time
; Host cppcheck cannot parse all FreeRTOS/Arduino macros; suppress known noise.
check_tool = cppcheck
check_flags =
    cppcheck: --enable=all --inline-suppr --suppress=*:*/.pio/* --suppress=syntaxError --suppress=unusedFunction --suppress=cstyleCast --suppress=comparePointers --suppress=missingIncludeSystem
build_flags =
    -Isrc
    -DCORE_DEBUG_LEVEL=4
    -Wall
    -Wextra
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Explicit vs library header defaults (RUNNING_CORE=-1 any, STACK=16K).
    ; Maintainer personal rec is CORE=1 / STACK=4096; we keep CORE=0 (WiFi/lwIP)
    ; and 16K because request handlers allocate large stack buffers.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Arduino/pioarduino injects -std=gnu++2b then -std=gnu++2a after board_build.cppstd.
build_unflags =
    -std=gnu++2a
    -std=gnu++2b
    -std=gnu++17
    -std=gnu17
; ESP32Async: strict+chain so LDF does not pick the archived me-no-dev AsyncTCP fork.
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
    ; Nayuki C QR encoder (no heap). Fork only adds library.json (srcDir=c);
    ; pinned commit == nayuki/QR-Code-generator v1.8.0 C sources (registry label 1.7.2 is misleading).
    ; Official nayuki repo has no PIO manifest.
    https://github.com/liux-pro/QR-Code-generator.git#985e1fb65c03685b6a1e3405faeee9d6c6525592
extra_scripts =
    pre:scripts/pio/pio_pre_frontend.py
    pre:scripts/pio/pio_cxx_std.py
    scripts/pio/pio_cxx_std.py
    post:scripts/pio/pio_fix_compile_commands.py

[env:esp32s3-release]
extends = env:esp32s3
; -flto was tested: linking fails (undefined app_main / LTO incompatible with prebuilt Arduino libraries).
build_flags =
    -Isrc
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -Os
    -DNDEBUG
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Keep in sync with env:esp32s3 (release build_flags replace the inherited list).
    ; AsyncTCP CORE=0 / STACK=16K: see env:esp32s3 comment (not maintainer CORE=1 / 4K).
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++2a
    -std=gnu++2b
    -std=gnu++17
    -std=gnu17
; inherit extra_scripts from esp32s3

[env:native]
platform = native
test_framework = unity
lib_deps =
    throwtheswitch/Unity@2.6.1
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -Isrc
    -Isim
    -std=gnu++23
    -Wall
    -Wextra
    -Wshadow
    -Wformat=2
    -Wundef
    -Wpointer-arith
build_src_filter =
    -<*>

; Same Unity suite with ASan + UBSan (host only).
[env:native-asan]
platform = native
test_framework = unity
lib_deps =
    throwtheswitch/Unity@2.6.1
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -Isrc
    -Isim
    -std=gnu++23
    -Wall
    -Wextra
    -Wshadow
    -Wformat=2
    -Wundef
    -Wpointer-arith
    -g
    -O1
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
build_src_filter =
    -<*>
extra_scripts =
    pre:scripts/pio/pio_native_asan.py

; Alias: run only device-sim Unity scenarios.
[env:device-sim]
extends = env:native
test_filter = test_device_sim
