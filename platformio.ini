; Production firmware: pio run -e esp32s3-release (default environment, CORE_DEBUG_LEVEL=0)
; Target board: Waveshare ESP32-S3-ePaper-1.54G (SKU 34586).
[platformio]
default_envs = esp32s3-release

[env:esp32s3]
; Development platform is pinned because the stable 3.3.11 package predates the SHA-256
; HTTPUpdate APIs. The framework commit contains arduino-esp32 PRs #12824 and #12848.
platform = https://github.com/pioarduino/platform-espressif32.git#129f7106c479c81a6bdf4df956bfebfd40930207
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#a4673c1d7d35e0755ee7579584c9ae0534eb2499
    framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/esp32-arduino-libs-idf-release_v5.5-b774170f-v1.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
board_build.cppstd = gnu++17
; Match runtime setCpuFrequencyMhz(240) / esp_pm max_freq (avoid F_CPU vs. actual mismatch).
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_chaya_8mb.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters =
    esp32_exception_decoder
    time
; Host cppcheck cannot parse all FreeRTOS/Arduino macros; suppress known noise.
check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,performance,portability --inline-suppr --suppress=*:*/.pio/* --suppress=syntaxError --suppress=unusedFunction --suppress=cstyleCast --suppress=comparePointers --suppress=missingIncludeSystem
build_flags =
    -DCORE_DEBUG_LEVEL=4
    -Wall
    -Wextra
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Keep AsyncTCP beside WiFi/lwIP on core 0; make effective library defaults explicit.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    ZinggJM/GxEPD2@1.6.9
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0
extra_scripts =
    pre:scripts/pio_pre_frontend.py

[env:esp32s3-release]
extends = env:esp32s3
; -flto was tested: linking fails (undefined app_main / LTO incompatible with prebuilt Arduino libraries).
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -Os
    -DNDEBUG
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Keep in sync with env:esp32s3 (release build_flags replace the inherited list).
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; inherit extra_scripts from esp32s3

[env:native]
platform = native
test_framework = unity
build_flags =
    -Isrc
    -Isim
    -std=gnu++17
    -Wall
    -Wextra
build_src_filter =
    -<*>

; Same Unity suite with ASan + UBSan (host only).
[env:native-asan]
platform = native
test_framework = unity
build_flags =
    -Isrc
    -Isim
    -std=gnu++17
    -Wall
    -Wextra
    -g
    -O1
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
build_src_filter =
    -<*>
extra_scripts =
    pre:scripts/pio_native_asan.py

; Alias: run only device-sim Unity scenarios.
[env:device-sim]
extends = env:native
test_filter = test_device_sim
